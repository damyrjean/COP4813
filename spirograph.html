<title>Spirograph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centered column, controls above a square canvas */
  :root {
    --bg: #f3f4f7;
    --panel: #ffffff;
    --fg: #1d2230;
    --muted: #5d6478;
    --line: #d6d9e2;
    --accent: #3a5bd9;
    --error: #b3261e;
    --canvas-bg: #ffffff;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141b; --panel: #1b1e28; --fg: #e6e8ef; --muted: #9aa1b5;
      --line: #2e3242; --accent: #7d97ff; --error: #ff8a80; --canvas-bg: #0d0f15;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141b; --panel: #1b1e28; --fg: #e6e8ef; --muted: #9aa1b5;
    --line: #2e3242; --accent: #7d97ff; --error: #ff8a80; --canvas-bg: #0d0f15;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px;
    padding: 24px 16px 40px;
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 600; }
  .formula { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); line-height: 1.6; margin: 0; overflow-x: auto; }
  form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
  label span { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 0.75rem; }
  input {
    font: 500 1rem var(--mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--fg); width: 100%; box-sizing: border-box;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.bad { border-color: var(--error); }
  button {
    font: 600 1rem var(--sans); padding: 9px 20px; border: 0; border-radius: 6px;
    background: var(--accent); color: var(--panel); cursor: pointer;
  }
  #msg { min-height: 1.2em; margin: 0; font-size: 0.85rem; color: var(--error); }
  canvas {
    width: 100%; max-width: 100%; aspect-ratio: 1; display: block;
    background: var(--canvas-bg); border: 1px solid var(--line); border-radius: 8px;
  }
  @media (max-width: 480px) {
    form { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    button { grid-column: 1 / -1; }
  }
</style>

<main>
  <h1>Spirograph</h1>
  <p class="formula">x = (R+r)·cos(t) − (r+O)·cos(((R+r)/r)·t)<br>y = (R+r)·sin(t) − (r+O)·sin(((R+r)/r)·t)</p>

  <form id="controls" novalidate>
    <label for="bigR">R (outer circle)<span>60 to 150</span>
      <input id="bigR" type="number" value="120" min="60" max="150" step="1">
    </label>
    <label for="smallR">r (inner circle)<span>10 to R − 1</span>
      <input id="smallR" type="number" value="45" min="10" max="149" step="1">
    </label>
    <label for="offset">O (pen offset)<span>0 to 80</span>
      <input id="offset" type="number" value="40" min="0" max="80" step="1">
    </label>
    <button id="start" type="submit">Start</button>
  </form>
  <p id="msg" role="alert"></p>

  <canvas id="spiro" width="600" height="600"></canvas>
</main>

<script>
  var canvas = document.getElementById("spiro");
  var ctx = canvas.getContext("2d");
  var size = canvas.width;
  var R, r, O, t, tEnd, scale, x, y, hue, running = null;

  // Pen position from the spirograph equations, scaled and centered on the canvas
  function getPosition(t) {
    var k = (R + r) / r;
    x = size / 2 + scale * ((R + r) * Math.cos(t) - (r + O) * Math.cos(k * t));
    y = size / 2 + scale * ((R + r) * Math.sin(t) - (r + O) * Math.sin(k * t));
  }

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  function readInputs() {
    var fields = ["bigR", "smallR", "offset"];
    fields.forEach(function (id) { document.getElementById(id).classList.remove("bad"); });

    var vR = Number(document.getElementById("bigR").value);
    var vr = Number(document.getElementById("smallR").value);
    var vO = Number(document.getElementById("offset").value);

    if (!Number.isInteger(vR) || vR < 60 || vR > 150) return fail("bigR", "R must be a whole number from 60 to 150.");
    if (!Number.isInteger(vr) || vr < 10 || vr >= vR) return fail("smallR", "r must be a whole number from 10 up to " + (vR - 1) + " (less than R).");
    if (!Number.isInteger(vO) || vO < 0 || vO > 80) return fail("offset", "O must be a whole number from 0 to 80.");

    document.getElementById("msg").textContent = "";
    return { R: vR, r: vr, O: vO };
  }

  function fail(id, text) {
    document.getElementById(id).classList.add("bad");
    document.getElementById("msg").textContent = text;
    return null;
  }

  function drawSegment() {
    ctx.beginPath();
    ctx.moveTo(x, y);
    t += 0.02;
    getPosition(t);
    ctx.strokeStyle = "hsl(" + hue + ", 80%, 55%)";
    hue = (hue + 0.3) % 360;
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  function animate() {
    for (var i = 0; i < 25 && t < tEnd; i++) drawSegment();
    if (t < tEnd) running = requestAnimationFrame(animate);
    else running = null; // pattern has closed, so stop drawing
  }

  document.getElementById("controls").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = readInputs();
    if (!v) return;
    R = v.R; r = v.r; O = v.O;

    if (running) cancelAnimationFrame(running);

    // Start from a blank canvas
    ctx.fillStyle = getComputedStyle(canvas).backgroundColor;
    ctx.fillRect(0, 0, size, size);
    ctx.lineWidth = 1.5;

    // Fit the whole pattern inside the canvas
    scale = (size / 2 - 12) / (R + 2 * r + O);

    // The curve closes after r / gcd(R, r) full turns
    tEnd = 2 * Math.PI * (r / gcd(R, r));
    t = 0;
    hue = Math.random() * 360;
    getPosition(t);
    running = requestAnimationFrame(animate);
  });

  // Blank canvas on load
  ctx.fillStyle = getComputedStyle(canvas).backgroundColor;
  ctx.fillRect(0, 0, size, size);
</script>
